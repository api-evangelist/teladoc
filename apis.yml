apis:
- name: Teladoc Health Solo External API
  description: >-
    REST API for the Teladoc Health Solo virtual-care platform. Manages
    patients, appointments, waiting rooms, appointment slots, visit notes,
    attachments, patient documents, episodes of care, encounter reports,
    integrations (Perfect Answer), virtual nursing/sitting requests, and
    webhooks. All resources are served under the /qapi/v1 path and authenticate
    with an Api-Key request header.
