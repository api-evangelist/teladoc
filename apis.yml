name: Teladoc
description: >-
  Teladoc Health is a global virtual-care company providing telehealth, mental
  and behavioral health, chronic-condition management, and expert medical
  opinion services. Its developer surface is the Solo platform: a partner-gated
  REST API (the Solo External API, served under /qapi/v1 on visitnow.org) for
  patients, appointments, waiting rooms, visit notes, episodes of care,
  encounter reports, virtual nursing, and webhooks, plus native iOS and Android
  Mobile SDKs for embedding virtual care into partner applications. Access is
  granted under a partner agreement and Business Associate Agreement (BAA);
  requests authenticate with a static Api-Key header. Sector: healthtech.
