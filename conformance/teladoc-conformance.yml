standards:
- id: hipaa
  conforms: true
  evidence: >-
    Teladoc Health publishes a HIPAA Notice of Privacy Practices
    (https://www.teladochealth.com/legal/notice-of-privacy-practices, HTTP 200)
    and a Consumer Health Data Privacy Policy, and its privacy policy states that
    information in secure Teladoc Health sites is PHI covered by HIPAA. The Solo
    External API handles PHI and is granted under a Business Associate Agreement
    (BAA); webhook payloads and context-aware links are AES-256-CBC encrypted.
- id: hitrust-csf
  conforms: unverified
  evidence: >-
    Teladoc Health and InTouch Health each announced HITRUST CSF certification in
    press releases (2017 and later), but both first-party URLs now 301 to an
    empty /newsroom and ir.teladochealth.com returns 403, so no live first-party
    page states a current certification. No trust centre exists at
    trust.teladochealth.com (no DNS). Recorded as unverified rather than true —
    a historical announcement is not a current published certification.
- id: oauth2
  conforms: false
  evidence: Authentication is a static Api-Key header, not OAuth2.
- id: oidc
  conforms: false
  evidence: >-
    No openid-configuration is served on any host; /.well-known/openid-configuration
    on demo.visitnow.org returns the SPA shell, not a discovery document.
- id: fhir
  conforms: partial
  evidence: >-
    The REST resource model (/qapi/v1/patients, /appointments, /episodes) is
    proprietary, not FHIR. But the intake:completed webhook payload IS a
    FHIR-shaped resource: a DiagnosticReport with status, subject.identifier
    (system SPID), encounter.identifier (system SAID), issued, and contained[]
    Observation resources carrying code.text and valueString. The documentation
    never uses the word FHIR and names no version or profile, so this is FHIR
    resource shape without a FHIR conformance claim, capability statement or
    /metadata endpoint.
- id: rfc9457-problem-details
  conforms: false
  evidence: >-
