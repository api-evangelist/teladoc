notes: >-
  The Solo External API does not use RFC 9457 application/problem+json. There is
  no error code vocabulary at all — no machine-readable code, type or field
  pointer — only an HTTP status plus a human string, and the API ships TWO
  incompatible envelopes for that string: a flat {"message": ...} in the older
  documented operations and a nested {"error": {"message": ...}} on the newer
  Perfect Answer surface. An unauthenticated live probe returned the nested form
  with an EMPTY message, so a client cannot rely on the string being populated
  either. Any agent or SDK must handle both shapes and branch on status code.
