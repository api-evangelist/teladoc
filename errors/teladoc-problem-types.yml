envelope:
  shape: json-object
  fields:
  - name: message
    description: Human-readable description of the error condition.
  example: '{"message": "Missing Required Parameters"}'
notes: >-
  The Solo External API does not use RFC 9457 application/problem+json. Errors
  are returned as a plain JSON object carrying a human-readable message field,
  with the failure signalled by the HTTP status code.
problems:
