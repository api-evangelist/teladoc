- status: 403
  title: Forbidden
  meaning: Authentication missing/invalid or the API key lacks access to the resource.
- status: 404
  title: Not Found
  meaning: The addressed resource (patient, appointment, device, report) does not exist.
  example_message: Device could not be found
- status: 422
  title: Unprocessable Entity
  meaning: The request was well-formed but failed validation of its contents.
