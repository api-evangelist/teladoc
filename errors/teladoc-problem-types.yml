- status: 404
  title: Not Found
  meaning: The addressed resource (patient, appointment, device, report) does not exist.
  example_message: Device could not be found
- status: 422
  title: Unprocessable Entity
  meaning: The request was well-formed but failed validation of its contents.
  example_message: A visit has already been created for the patient within 24 hours
  note: >-
    Documented on POST /qapi/v1/perfect-answer as "Rejected request" — a
    business-rule rejection, not a schema failure, carried in the same envelope
    as a validation error with nothing to distinguish them programmatically.
